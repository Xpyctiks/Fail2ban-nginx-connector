log_format postdata escape=json '$remote_addr [$time_local] "Host: $host" "Country: $http_cf_ipcountry" "User: $remote_user" "Cert: $ssl_client_s_dn" "Request: $request" "Code: $status" "Req.time: $request_time" "Size: $bytes_sent" "Http-refferer: $http_referer" "User-agent: $http_user_agent" "TLS: $ssl_protocol/$ssl_cipher" "Req.body: $request_body" "Cache: $upstream_cache_status"';

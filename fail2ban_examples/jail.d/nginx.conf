#change pathes to yours
[nginx-403]
enabled  = true
filter   = nginx-403
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 60
bantime  = 7d
action   = nginx-block

[nginx-404]
enabled  = true
filter   = nginx-404
logpath  = /var/log/nginx/access.log
maxretry = 100
findtime = 60
bantime  = 7d
action   = nginx-block

[nginx-500]
enabled  = true
filter   = nginx-500
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 60
bantime  = 7d
action   = nginx-block

[nginx-sqlinjection]
enabled  = true
filter   = nginx-sqlinjection
logpath  = /var/log/nginx/access.log
maxretry = 3
findtime = 60
bantime  = 7d
action   = nginx-block

[nginx-form-spam]
enabled  = true
filter   = nginx-form-spam
logpath  = /var/log/nginx/access.log
maxretry = 1
findtime = 1h
bantime  = 7d
action   = nginx-block

[nginx-form-flood]
enabled  = true
filter   = nginx-form-flood
logpath  = /var/log/nginx/access.log
maxretry = 3
findtime = 10m
bantime  = 7d
action   = nginx-block
